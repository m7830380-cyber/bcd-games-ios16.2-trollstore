# iOS 16 / TrollStore port: Swift, Objective-C and C compile errors against an
# iOS 16.0 deployment target in minutes, without the hours the native libraries
# take. The link step fails here by design (no native libraries).
name: Compile check (iOS 16, no link)

on:
  push:
    branches: [ios16-trollstore]
    paths: ['app/**', '.github/workflows/compile-check-ios16.yml']
  workflow_dispatch:

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Compile
        run: |
          # Folders the full build fills (native libraries, OpenGL/Vulkan, compat): empty here.
          mkdir -p app/Madeira/x86_64-vcruntime app/Madeira/compat app/Madeira/gl app/Madeira/vulkan
          python3 tools/stikjit-interface-compat.py app/Frameworks/StikJIT.xcframework || true
          set +e
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            -skipPackagePluginValidation -continueBuildingAfterErrors build > xcodebuild.log 2>&1
          echo "xcodebuild exit $?"
          echo "== errors =="
          grep -E "^[^ ].*: (error|fatal error):" xcodebuild.log | sort -u > errors.txt
          wc -l < errors.txt
          head -400 errors.txt
          echo "== availability warnings =="
          grep -E "only available in iOS|is unavailable in iOS" xcodebuild.log | sort -u | head -100
          echo "== link/other =="; grep -E "^ld: |Undefined symbols|\*\* BUILD" xcodebuild.log | head -20
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-check-log
          path: |
            xcodebuild.log
            errors.txt
          retention-days: 5
