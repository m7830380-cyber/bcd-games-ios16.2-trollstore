name: Auto-Retry Build on Queue Timeout

on:
  workflow_run:
    workflows: ["Build BCD TrollStore Tipa & IPA (iOS 16.2+)"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  auto-retry:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'cancelled' }}
    steps:
      - name: Re-trigger Build on Queue Timeout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Previous build attempt was cancelled due to queue timeout. Re-dispatching build..."
          gh api -X POST /repos/${{ github.repository }}/actions/workflows/build-ipa.yml/dispatches -f ref=main
